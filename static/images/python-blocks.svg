<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#dde5f0"/>
  <rect width="640" height="48" fill="#1e293b"/>
  <text x="20" y="32" fill="#e2e8f0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">Python Blocks</text>
  <circle cx="590" cy="24" r="7" fill="#4ade80"/>
  <circle cx="614" cy="24" r="7" fill="#fbbf24"/>

  <!-- palette -->
  <rect x="0" y="48" width="110" height="312" fill="#f8fafc"/>
  <rect x="18" y="72" width="74" height="28" rx="6" fill="#c94ac5"/>
  <rect x="18" y="112" width="74" height="28" rx="6" fill="#5ba55b"/>
  <rect x="18" y="152" width="74" height="28" rx="6" fill="#5b80a5"/>
  <rect x="18" y="192" width="74" height="28" rx="6" fill="#e5a03b"/>

  <!-- when run (hat-like bar) -->
  <rect x="140" y="72" width="280" height="44" rx="12" fill="#c94ac5"/>
  <text x="160" y="100" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">when run</text>

  <!-- print -->
  <rect x="140" y="124" width="340" height="44" rx="12" fill="#c94ac5"/>
  <text x="160" y="152" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">print</text>
  <rect x="220" y="134" width="170" height="26" rx="6" fill="#ffffff"/>
  <text x="232" y="152" fill="#1e293b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600">"Hello, Python"</text>

  <!-- for -->
  <rect x="140" y="180" width="400" height="44" rx="12" fill="#5ba55b"/>
  <text x="160" y="208" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">for i in range</text>
  <rect x="320" y="190" width="40" height="26" rx="6" fill="#ffffff"/>
  <text x="332" y="208" fill="#1e293b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600">5</text>

  <!-- if -->
  <rect x="180" y="236" width="300" height="40" rx="12" fill="#5b80a5"/>
  <text x="200" y="262" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">if i &gt; 2 then</text>

  <!-- print i -->
  <rect x="200" y="288" width="220" height="40" rx="12" fill="#c94ac5"/>
  <text x="220" y="314" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">print i</text>

  <!-- side tray tiles -->
  <rect x="500" y="80" width="120" height="36" rx="8" fill="#e5a03b"/>
  <text x="520" y="104" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">variables</text>
  <rect x="500" y="128" width="120" height="36" rx="8" fill="#5b80a5"/>
  <text x="536" y="152" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">logic</text>
</svg>
