{% extends "base.html" %}
{% block title %}Register — {{ ACADEMY_NAME }}{% endblock %}
{% block content %}
<div class="auth-shell">
  <h1>Register free</h1>
  <p class="sub">Create your student account and choose the course you are taking.</p>
  <form class="form" method="post">
    <label>Full name
      <input type="text" name="full_name" required autocomplete="name">
    </label>
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" required minlength="6" autocomplete="new-password">
    </label>
    <label>Course
      <select name="course_id" required>
        <option value="" disabled selected>Select a course</option>
        {% for c in courses %}
        <option value="{{ c.id }}">{{ c.title }} ({{ c.level }})</option>
        {% endfor %}
      </select>
    </label>
    <button class="btn" type="submit">Create student account</button>
  </form>
  <p class="muted" style="margin-top:1rem">Already enrolled? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
